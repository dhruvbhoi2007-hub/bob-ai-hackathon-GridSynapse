submission:
  title: "OutageIQ"
  problem_statement: >
    Power transformer and substation failures cause blackouts costing utilities
    over $1M per hour and affecting millions of people. Most utilities still rely
    on fixed calendar-based maintenance schedules, even though sensor data
    already measuring temperature, vibration, partial discharge, and oil quality
    shows failure signatures weeks in advance. Weather events compound this risk,
    but sensor data and weather forecasts are rarely combined in time to act.
  solution_summary: >
    OutageIQ is an AI-powered grid intelligence system that combines real-time
    asset sensor data with live weather forecasts to predict which transformers
    and substations are at risk of failure. Built using IBM Bob as the core
    development and reasoning engine, OutageIQ scores each asset's risk,
    explains the reasoning in plain language, and generates a prioritized
    maintenance and crew pre-positioning plan for utility operations teams.
  key_features:
    - "Risk scoring engine combining sensor health, weather severity, and asset criticality"
    - "Plain-language AI-generated risk explanations for each asset"
    - "Prioritized maintenance and crew deployment recommendations"
    - "Built end-to-end using IBM Bob as the primary development agent"
                         

  tech_stack:
    languages: ["Python", "JavaScript", "HTML", "CSS"]
    frameworks: ["Flask", "flask-cors"]
    ibm_technologies: ["watsonx.ai", "IBM Bob", "ibm-watsonx-ai Python SDK"]
    databases: []
    other: ["Open-Meteo API", "python-dotenv", "GitHub Actions"]

  what_we_are_most_proud_of: >
    Building a fully working, explainable risk-scoring pipeline — from raw asset and
    weather data to a clear, actionable dashboard with AI-generated explanations and
    an interactive AI Advisor chat (Flask + watsonx.ai Granite) — developed end-to-end
    using IBM Bob as the primary coding agent. The pipeline gracefully degrades: if
    watsonx.ai is unavailable, the risk engine falls back to static rule-based
    explanations so the dashboard always works. Judges should pay special attention to
    the scoring normalization logic in risk_engine.py (ensuring a single bad sensor
    sets a high floor while additional breaches stack on top) and to the watsonx.ai
    integration in both risk_engine.py and app.py.

  known_limitations: >
    The risk score is a rule-based weighted formula (sensor 60%, weather 20%,
    criticality 20%), not a trained ML model — chosen for transparency and auditability.
    Asset and sensor data is synthetic (assets.json), not connected to real SCADA/sensor
    feeds. The AI Advisor backend (app.py) requires valid watsonx.ai credentials and has
    no offline fallback mode. No live cloud deployment — the solution runs entirely
    locally per hackathon rules. No authentication or multi-user support.

