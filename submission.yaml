submission:
  title: "OutageIQ"
  problem_statement: >
    Power transformer and substation failures cause blackouts costing utilities
    over $1M per hour and affecting millions of people. Most utilities still rely
    on fixed calendar-based maintenance schedules, even though sensor data
    already measuring temperature, vibration, partial discharge, and oil quality
    shows failure signatures weeks in advance. Weather events compound this risk,
    but sensor data and weather forecasts are rarely combined in time to act.
  solution_summary: >
    OutageIQ is an AI-powered grid intelligence system that combines real-time
    asset sensor data with live weather forecasts to predict which transformers
    and substations are at risk of failure. Built using IBM Bob as the core
    development and reasoning engine, OutageIQ scores each asset's risk,
    explains the reasoning in plain language, and generates a prioritized
    maintenance and crew pre-positioning plan for utility operations teams.
  key_features:
    - "Risk scoring engine combining sensor health, weather severity, and asset criticality"
    - "Plain-language AI-generated risk explanations for each asset"
    - "Prioritized maintenance and crew deployment recommendations"
    - "Built end-to-end using IBM Bob as the primary development agent"
                         

  tech_stack:
    languages: []                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: []                     # e.g., ["FastAPI", "React"]
    ibm_technologies: []               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: []                      # e.g., ["PostgreSQL", "Redis"]
    other: []                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

